name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.2.0)
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $Tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $Uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$Tag"
          $Headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $Exists = $false
          try {
            $null = Invoke-RestMethod -Uri $Uri -Headers $Headers
            $Exists = $true
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          "exists=$($Exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($Exists) { Write-Host 'Release already exists; keeping its published assets.' }
      - uses: actions/setup-python@v5
        if: steps.existing.outputs.exists != 'true'
        with:
          python-version: '3.13'
      - name: Build and test
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish assets
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $Version = (& .venv/Scripts/python.exe -c 'from mouse_battery_tray import __version__; print(__version__)').Trim()
          if ($env:RELEASE_TAG -ne "v$Version") { throw 'Tag does not match package version' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; existing assets will not be overwritten.'
            exit 0
          }
          $Notes = "docs/release-$($env:RELEASE_TAG).md"
          if (!(Test-Path $Notes)) { throw "Missing release notes: $Notes" }
          $Assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @Assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Mouse Battery Tray $($env:RELEASE_TAG)" --notes-file $Notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
