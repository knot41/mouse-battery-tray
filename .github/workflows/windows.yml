name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c requirements-build.txt -e '.[build]'
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MouseBatteryTray --icon docs/app.ico --paths src --copy-metadata pystray --copy-metadata Pillow --copy-metadata hidapi --copy-metadata six scripts/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: MouseBatteryTray-${{ github.sha }}-windows-x64
          path: |
            dist/MouseBatteryTray.exe
            LICENSE
            THIRD_PARTY.md
            README.md
