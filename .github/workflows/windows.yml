name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Build Python distributions
        shell: pwsh
        run: .venv/Scripts/python.exe -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: MouseBatteryTray-${{ github.sha }}-windows-x64
          path: dist/*
