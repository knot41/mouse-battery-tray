[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-battery-tray"
version = "0.2.0"
description = "Windows tray battery meter with low-battery alerts for VGN wireless mice"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = ["hidapi>=0.14,<0.16", "Pillow>=10,<13", "pystray>=0.19.5,<0.20"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7", "build>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/knot41/mouse-battery-tray"
Repository = "https://github.com/knot41/mouse-battery-tray"
Issues = "https://github.com/knot41/mouse-battery-tray/issues"
Changelog = "https://github.com/knot41/mouse-battery-tray/blob/main/CHANGELOG.md"

[project.scripts]
mouse-battery-tray = "mouse_battery_tray.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
